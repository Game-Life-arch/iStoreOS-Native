name: Build iStore OS 6.x

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

# 显式声明权限：发布/删除 Release 需要 contents: write
# （不写此项时默认 GITHUB_TOKEN 权限取决于仓库设置，可能导致发布失败）
permissions:
  contents: write

env:
  REPO_URL: https://github.com/istoreos/istoreos
  FEEDS_CONF: feeds.conf
  CONFIG_FILE: .config
  DIY_P1_SH: scripts/01_get_ready.sh
  DIY_P2_SH: scripts/02_add_device.sh
  DIY_P3_SH: scripts/03_prepare_package.sh
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  # 注意：不要在这里用 GITHUB_TOKEN 覆盖 GitHub 自动注入的 token，
  # 否则 secrets.GH_TOKEN 未配置时会把系统 token 覆盖成空串，
  # 导致"发布 Release/删除旧 Release"两个步骤全部失败。
  # GH_TOKEN（PAT）仅在"删除运行记录"步骤单独使用。

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        REPO_BRANCH:
          - istoreos-25.12
        ARCHITECTURE:
          - armv8
        os:
          - ubuntu-24.04

      fail-fast: false

    env:
      # 供"删除运行记录"步骤判断 GH_TOKEN 是否已配置，避免空 token 报错
      GH_TOKEN_PRESENT: ${{ secrets.GH_TOKEN != '' }}

    steps:
    - name: 合并磁盘
      uses: sbwml/actions@free-disk

    - name: 检出仓库
      uses: actions/checkout@v4

    - name: 创建目录
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/workdir
        chmod 755 ${GITHUB_WORKSPACE}/workdir
        echo "WORKDIR_PATH=$PWD" >> $GITHUB_ENV
        sudo timedatectl set-timezone 'Asia/Shanghai'

    - name: 检查服务器配置
      run: |
        echo -e "\n\e[1;32mCPU:\e[0m"
        echo "$(grep 'model name' /proc/cpuinfo | head -1 | awk -F ': ' '{print $2}') ($(grep 'cpu MHz' /proc/cpuinfo | head -1 | awk -F ': ' '{print $2}')MHz) x $(grep processor /proc/cpuinfo  | wc -l)"
        echo -e "\n\e[1;32mMemory:\e[0m"
        free -h
        echo -e "\n\e[1;32mStorage:\e[0m"
        df -Th / /mnt || true
        echo -e "\n\e[1;32mSystem:\e[0m"
        lsb_release -a 2>/dev/null || cat /etc/os-release
        echo -e "\n\e[1;32mKernel:\e[0m"
        uname -a
        echo

    - name: 初始化编译环境
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        sudo bash -c "curl -skL https://raw.githubusercontent.com/sbwml/actions/openwrt-build-setup/sources-24.04.list > /etc/apt/sources.list"
        sudo apt-get update
        sudo apt-get install -y build-essential flex bison cmake g++ gawk gcc-multilib g++-multilib gettext git gnutls-dev libfuse-dev libncurses5-dev libssl-dev python3 python3-pip python3-ply python3-pyelftools rsync unzip zlib1g-dev file wget subversion patch upx-ucl autoconf automake curl asciidoc binutils bzip2 lib32gcc-s1 libc6-dev-i386 uglifyjs msmtp texinfo libreadline-dev libglib2.0-dev xmlto libelf-dev libtool autopoint antlr3 gperf ccache swig coreutils haveged scons libpython3-dev rename qemu-utils jq
        sudo apt-get install -y npm
        sudo -E npm install -g pnpm
        sudo -E npm install -g n
        sudo -E n stable
        sudo apt-get clean

    - name: 安装 LLVM
      uses: sbwml/actions@install-llvm

    - name: 克隆源码
      working-directory: ${{ env.WORKDIR_PATH }}/workdir
      run: |
        df -hT $PWD
        git clone "$REPO_URL" -b "${{ matrix.REPO_BRANCH }}" openwrt
        ln -sf "${{ env.WORKDIR_PATH }}/workdir/openwrt" "$GITHUB_WORKSPACE/openwrt"

    - name: 缓存构建动作
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        mixkey: ${{ matrix.os }}-${{ matrix.ARCHITECTURE }}-${{ matrix.REPO_BRANCH }}
        prefix: ${{ github.workspace }}/openwrt

    - name: 加载自定义 feeds
      env:
        FEEDS_CONF_PATH: ${{ matrix.ARCHITECTURE }}/${{ env.FEEDS_CONF }}
      run: |
        if [ -e "$FEEDS_CONF_PATH" ]; then mv "$FEEDS_CONF_PATH" "openwrt/$FEEDS_CONF"; fi
        chmod +x "$DIY_P1_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P1_SH"

    - name: 更新 feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        cp -a $GITHUB_WORKSPACE/configfiles/node-pnpm feeds/packages/lang/
        ./scripts/feeds update packages
        ./scripts/feeds install -a

    - name: 加载自定义配置
      env:
        CONFIG_FILE_PATH: ${{ matrix.ARCHITECTURE }}/${{ env.CONFIG_FILE }}
      run: |
        if [ -e files ]; then mv files openwrt/files; fi
        if [ -e "$CONFIG_FILE_PATH" ]; then mv "$CONFIG_FILE_PATH" "openwrt/$CONFIG_FILE"; fi
        chmod +x "$DIY_P2_SH"
        chmod +x "$DIY_P3_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P2_SH"
        "$GITHUB_WORKSPACE/$DIY_P3_SH"

    - name: SSH 连接超时（20 分钟无人连接则按默认配置编译）
      # 环境已就绪：feeds 已更新、.config 已就位。
      # 此步骤打印 SSH 链接（展开步骤日志查看），供用户连上去改配置；
      # 连接后修改完退出（exit / Ctrl+D）立即继续编译；
      # 20 分钟内无人连接则自动按默认配置继续。
      uses: lhotari/action-upterm@v1
      with:
        limit-access-to-actor: true
        wait-timeout-minutes: 20

    - name: 下载软件包
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        if ! make -j$(nproc); then
          echo "::error::多线程编译失败，输出详细日志..."
          echo "::group::📋 详细编译日志（V=s）"
          make -j1 V=s
          echo "::endgroup::"
          exit 1
        fi
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
        echo "status=success" >> ${GITHUB_OUTPUT}

    - name: 检查磁盘空间
      if: (!cancelled())
      run: df -hT

    - name: 上传 bin 文件夹
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: 整理固件文件
      id: organize
      # 加上编译成功条件：编译失败时 bin/targets 不存在，避免 cd 通配符不匹配产生额外报错
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> ${GITHUB_OUTPUT}

    - name: 上传固件目录
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: 生成发布标签
      id: tag
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H.%M")-${{ matrix.ARCHITECTURE }}" >> ${GITHUB_OUTPUT}
        touch release.txt
        echo "
        🖥️ Architecture: rockchip-${{ matrix.ARCHITECTURE }}

        🔀 Branch: ${{ matrix.REPO_BRANCH }}

        📂 Source Code: ${{ env.REPO_URL }}

        🕒 Compilation Time: $(date +"%Y年%m月%d日%H时%M分") " >> release.txt
        echo "status=success" >> ${GITHUB_OUTPUT}

    - name: 自动发布固件到 Releases
      uses: softprops/action-gh-release@v2.2.1
      if: steps.tag.outputs.status == 'success' && !cancelled()
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: |
          ${{ env.FIRMWARE }}/*squashfs-sysupgrade.img.gz

    - name: 删除运行记录
      uses: Mattraks/delete-workflow-runs@v2.1.0
      # GH_TOKEN 未配置时跳过，避免空 token 报错
      if: env.GH_TOKEN_PRESENT == 'true'
      with:
        retain_days: 1
        keep_minimum_runs: 1
        token: ${{ secrets.GH_TOKEN }}

    - name: 删除自动发布的旧固件
      uses: dev-drprasad/delete-older-releases@v0.3.4
      # 编译成功才清理旧固件，避免构建失败时误删已有 Release
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      env:
        # 该 action 需要显式传入 GITHUB_TOKEN 环境变量（系统自动 token 不会自动注入环境）
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        keep_latest: 15
        delete_tags: true
